name: gym_management_app
description: "A Management App for Gym"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  cloud_firestore: ^6.5.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  firebase_in_app_messaging: ^0.9.2+3
  firebase_messaging: ^16.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  gap: ^3.0.1
  http: ^1.2.0
  get_it: ^9.2.1
  go_router: ^14.8.0
  google_fonts: ^8.1.0
  icon_decoration: ^2.1.0
  image_picker: ^1.1.2
  loading_overlay: ^0.5.0
  mobile_scanner: ^7.2.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  device_preview: ^1.3.1
  googleapis_auth: ^2.3.2
  cached_network_image: ^3.4.1

#Flutter Assets Generator
flutter_assets:
  assets_path: assets/
  output_path: lib\core\utils
  filename: assets.dart
  ignore_comments: true
  field_prefix: null
dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/manHandADumbel.png"

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/cards/
    - assets/cloud_messages.json
